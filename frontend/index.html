  const e = app.exam;
  await refreshExamState();
  setTop("3. 사진 올리기", "",
    app.sheets.length ? `<a class="btn primary" href="#/review">다음: 검수 →</a>` : "");

  $("view").innerHTML = `
    <div class="card">
      <label class="drop" id="drop" for="photos">
        <b>여기로 사진을 끌어 놓거나 눌러서 고르세요</b>
      </label>
      <input type="file" id="photos" accept="image/*" multiple hidden>
      <div id="upState"></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:12px"><h2 style="margin:0">올린 답안지</h2><span class="pill gray" id="nSheets"></span></div>
      <div id="sheetTable"></div>
    </div>`;

  drawSheetTable();

  const drop = $("drop");
  drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (ev) => { ev.preventDefault(); drop.classList.remove("over"); upload([...ev.dataTransfer.files]); };
  $("photos").onchange = (ev) => upload([...ev.target.files]);

  // 5장씩 나눠 보내서 진행 막대를 보여 줌 (서버는 한 장씩 판독함)
  async function upload(files) {
    files = files.filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|bmp|webp)$/i.test(f.name));
    if (!files.length) return;
    const box = $("upState");
    box.innerHTML = `<div class="progress"><div id="bar"></div></div><div class="small muted" id="upText"></div>`;
    const results = [];
    for (let i = 0; i < files.length; i += 5) {
      $("upText").textContent = `${i} / ${files.length}장 판독 중…`;
      const fd = new FormData(); for (const f of files.slice(i, i + 5)) fd.append("files", f);
      try { results.push(...(await api(`/api/exams/${e.exam_id}/sheets`, { method: "POST", body: fd })).sheets); }
      catch (ex) { box.innerHTML = `<div class="msg err" style="margin-top:12px">${esc(ex.message)}</div>`; return; }
      $("bar").style.width = `${Math.min(100, ((i + 5) / files.length) * 100)}%`;
    }
    await refreshExamState();
    const bad = results.filter(r => r.status !== "read");
    const rev = results.filter(r => r.status === "read" && r.needs_review).length;
    box.innerHTML = `<div class="msg ${bad.length ? "err" : "ok"}" style="margin-top:14px">
      ${results.length}장 중 ${results.length - bad.length}장 판독 완료${rev ? `, 그중 ${rev}장은 검수가 필요합니다` : ""}.
      ${bad.length ? `<br>판독하지 못한 사진: ${bad.map(b => `${esc(b.source)} (${esc(b.error || STATUS_TEXT[b.status]?.[1])})`).join(", ")}` : ""}</div>`;
    $("photos").value = "";
    drawSheetTable(); renderSide();
    setTop("3. 사진 올리기", "",
      `<a class="btn primary" href="#/review">다음: 검수 →</a>`);
  }
}
function drawSheetTable() {
  const list = [...(app.sheets || [])].reverse();   // 최근에 올린 것부터
  $("nSheets").textContent = `${list.length}장`;
  $("sheetTable").innerHTML = list.length ? `<div class="tablewrap"><table class="t">
    <thead><tr><th>사진 파일</th><th>학번</th><th>상태</th><th>올린 시각</th><th></th></tr></thead>
    <tbody>${list.map(s => `<tr>
      <td>${esc(s.source)}</td>
      <td class="mono">${esc(s.student_id || s.student_id_raw || "-")}</td>
      <td>${sheetPill(s)}${s.error ? `<div class="small muted">${esc(s.error)}</div>` : ""}</td>
      <td>${fmtDate(s.processed_at)}</td>
      <td style="text-align:right">${s.status === "read" ? `<a class="btn" href="#/review" data-sid="${s.sheet_id}">보기</a>` : ""}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<div class="empty"><b>아직 올린 사진이 없습니다</b></div>`;
  for (const a of document.querySelectorAll("a[data-sid]")) a.onclick = () => { app.reviewSel = a.dataset.sid; };
}

// ---------------- 4. 검수 ----------------

const READ_WHY = { ambiguous: "흐린 표시", multi: "여러 개 표시", blank: "", ok: "" };

async function pageReview() {
  const e = app.exam;
  await refreshExamState();
  setTop("4. 검수", "",
    `<a class="btn primary" href="#/results">다음: 결과 보기 →</a>`);

  const readSheets = app.sheets.filter(s => s.status === "read");
  if (!app.sheets.length) {
    $("view").innerHTML = `<div class="card"><div class="empty"><b>아직 올린 사진이 없습니다</b></div></div>`;
    return;
  }
  // 목록 필터: need(검수 필요) / all(전체) / bad(재촬영)
  let filter = pendingCount() ? "need" : "all";
  let sel = app.reviewSel || null;

  $("view").innerHTML = `
    <div id="detail"></div>
    <div class="card slist">
      <div class="filters" id="filters"></div>
      <div id="slist"></div>
    </div>`;

  function listItems() {
    if (filter === "need") return app.sheets.filter(needsReview);
    if (filter === "bad") return app.sheets.filter(s => s.status !== "read");
    return app.sheets;
  }
  function drawList() {
    const nBad = app.sheets.length - readSheets.length;
    $("filters").innerHTML = [["need", `검수 필요 ${pendingCount()}`], ["all", `전체 ${app.sheets.length}`], ["bad", `재촬영 ${nBad}`]]
      .map(([k, t]) => `<button aria-pressed="${filter === k}" data-f="${k}">${t}</button>`).join("");
    const items = listItems();
    $("slist").innerHTML = items.length ? items.map(s => `
      <div class="it ${s.sheet_id === sel ? "sel" : ""}" data-sid="${s.sheet_id || ""}">
        <div><div class="nm">${esc(s.student_id || s.student_id_raw || "학번 미확인")}</div><div class="src">${esc(s.source)}</div></div>
        ${sheetPill(s)}
      </div>`).join("")
      : `<div class="empty small">${filter === "need" ? "검수할 답안지가 없습니다 🎉" : "해당하는 답안지가 없습니다"}</div>`;
  }
  $("filters").onclick = (ev) => { const b = ev.target.closest("button"); if (!b) return; filter = b.dataset.f; drawList(); };
  $("slist").onclick = (ev) => {
    const it = ev.target.closest(".it"); if (!it || !it.dataset.sid) return;
    sel = it.dataset.sid; drawList(); openSheet(sel);
  };

  drawList();
  if (!sel || !app.sheets.some(s => s.sheet_id === sel)) sel = listItems()[0]?.sheet_id;
  if (sel) { drawList(); openSheet(sel); }
  else $("detail").innerHTML = `<div class="card"><div class="empty"><b>답안지를 고르세요</b></div></div>`;

  // 답안지 한 장 열기: 판독 원본 + 지금까지의 검수 값을 합쳐서 문항별로 보여 줌
  async function openSheet(sid) {
    app.reviewSel = sid;
    const box = $("detail");
    box.innerHTML = `<div class="card"><div class="empty">불러오는 중…</div></div>`;
    const rec = await api(`/api/exams/${e.exam_id}/sheets/${sid}`);
    if (rec.status !== "read") {
      box.innerHTML = `<div class="card"><h2>${esc(rec.source)}</h2><div class="msg err" style="margin-top:12px">${esc(rec.error || "판독하지 못했습니다")}</div></div>`;
      return;
    }
    const read = rec.read, corr = (rec.review && rec.review.corrections) || {};
    const C = e.num_choices;
    // cur[q] = 지금 화면에서 고른 답. 검수한 값이 있으면 그것, 없으면 판독한 답
    const cur = {};
    for (const m of read.mcq) cur[m.q] = corr[m.q] != null ? [...corr[m.q]] : (m.answer ? [...m.answer] : []);
    // 내가 검수할 수 있는 문항 (문항 범위 담당이면 그 범위만). 범위 밖 문항은 보기만 함
    const rscope = new Set(myScope().review);
    const flagged = read.mcq.filter(m => m.needs_review && rscope.has(m.q));
    // decided = 사람이 답을 고른 확인 대상 문항 (예전에 검수한 문항은 이미 고른 것으로 봄)
    // 확인 대상 문항을 하나도 안 건드리고 저장하면 전부 무응답으로 확정되는 실수를 막으려고 씀
    const decided = new Set(flagged.filter(m => corr[m.q] != null).map(m => m.q));
    const keyAns = app.key ? app.key.answers : null;
    let showAll = flagged.length === 0;
    const sidRead = read.student_id;
    const sidNow = (rec.review && rec.review.student_id) || sidRead.text || "";
    // 사진 위 표시: crops = 정렬 이미지 안의 문항 줄·학번 칸 위치 (0~1 비율). 없으면 표시 없이 사진만
    const crops = rec.crops, imgUrl = `${API_BASE}/api/exams/${e.exam_id}/sheets/${sid}/image`;
    // 학번 칸 사진 조각: 정렬 이미지를 배경으로 깔고 학번 칸 위치만 보여 줌 (가로 폭에 맞춰 늘어남)
    const sidCrop = (b) => {
      const [x, y, cw, ch] = b, ratio = (cw * crops.aspect) / ch;
      const px = cw >= 1 ? 0 : (x / (1 - cw)) * 100, py = ch >= 1 ? 0 : (y / (1 - ch)) * 100;
      return `<div style="width:100%;max-width:340px;aspect-ratio:${ratio.toFixed(4)};border:${sidRead.needs_review ? "3px solid var(--warn)" : "1px solid var(--line)"};border-radius:6px;background:#fff url('${imgUrl}') no-repeat;background-size:${(100 / cw).toFixed(2)}% ${(100 / ch).toFixed(2)}%;background-position:${px.toFixed(3)}% ${py.toFixed(3)}%"></div>`;
    };
    const boxAt = (b, cls, attr = "") => b ? `<div class="hl ${cls}" ${attr} style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${b[2] * 100}%;height:${b[3] * 100}%"></div>` : "";

    // 왼쪽 = 사진 (화면을 내려도 따라옴), 오른쪽 = 검수
    box.innerHTML = `
      <div class="rv ${crops && crops.aspect > 1 ? "land" : ""}">
        <div class="card rv-photo" id="photoCard">
          ${crops ? `<div class="ptools"><button class="btn" id="zoomBtn" style="padding:4px 12px">전체 사진</button></div>` : ""}
          <div class="pwrap" id="photoBox"><div class="empty">사진 불러오는 중…</div></div></div>
        <div class="card">
          <div class="row" style="margin-bottom:14px">
            <h2 style="margin:0">${esc(rec.source)}</h2>
            ${flagged.length ? `<span class="pill warn">확인할 문항 ${flagged.length}개</span>` : `<span class="pill ok">모든 문항 판독됨</span>`}
            ${rec.review && rec.review.updated_at ? `<span class="pill gray">검수함 ${fmtDate(rec.review.updated_at)}</span>` : ""}
          </div>
          <div class="field sid" data-sidrow="1">
            <span class="label" style="margin:0">학번</span>
            <input type="text" id="sidInput" inputmode="numeric" maxlength="10" value="${esc(sidNow)}" placeholder="${esc(sidRead.raw)}">
            ${sidRead.needs_review ? `<span class="pill warn">학번 확인 (읽은 값: ${esc(sidRead.raw)})</span>` : `<span class="small">읽은 값: ${esc(sidRead.raw)}</span>`}
          </div>
          ${crops && crops.sid ? `<div id="sidPhoto" style="margin:0 0 6px">${sidCrop(crops.sid)}</div>` : ""}
          <div class="row" style="margin:6px 0 10px">
            <label class="small" style="margin-left:auto"><input type="checkbox" id="showAll" ${showAll ? "checked" : ""}> 모든 문항 보기</label>
          </div>
          <div id="qlist"></div>
          <div class="savebar">
            <div class="msg err" id="revErr" style="display:none;margin:0"></div>
            <button class="btn" id="skip" style="margin-left:auto">다음 답안지</button>
            <button class="btn primary big" id="saveRev">확인 완료</button>
          </div>
        </div>
      </div>`;

    // 정렬된 사진 + 확인할 문항(주황 테두리)·지금 보는 문항(파란 테두리) 표시
    const img = new Image();
    img.alt = "정렬된 답안지 사진";
    // 판독 영역 = 객관식 줄 + 서술형 답 칸을 모두 감싸는 사각형. 기본은 이 부분만 크게 보여 줌 (학번·여백 잘라 냄, kim 11/10)
    // 학번은 오른쪽 학번 입력칸 밑에 그 칸 사진만 따로 보여 줌
    let area = [0, 0, 1, 1], zoomed = false;
    if (crops) {
      const bs = [...Object.values(crops.mcq), ...Object.values(crops.short || {})];
      const x0 = Math.max(0, Math.min(...bs.map(b => b[0])) - 0.01), y0 = Math.max(0, Math.min(...bs.map(b => b[1])) - 0.01);
      const x1 = Math.min(1, Math.max(...bs.map(b => b[0] + b[2])) + 0.01), y1 = Math.min(1, Math.max(...bs.map(b => b[1] + b[3])) + 0.01);
      area = [x0, y0, x1 - x0, y1 - y0]; zoomed = true;
    }
    // 사진 칸 크기·위치 맞추기: pwrap = 보이는 창, inner = 사진 전체 (area 부분이 창에 꽉 차게 늘리고 옮김)
    function fitPhoto() {
      const pb = $("photoBox"), inner = pb && pb.querySelector(".inner"); if (!inner) return;
      const [ax, ay, aw, ah] = zoomed ? area : [0, 0, 1, 1];
      pb.style.aspectRatio = `${aw * (crops ? crops.aspect : img.naturalWidth / img.naturalHeight)} / ${ah}`;
      Object.assign(inner.style, { width: `${100 / aw}%`, height: `${100 / ah}%`, left: `${-ax / aw * 100}%`, top: `${-ay / ah * 100}%` });
      if ($("zoomBtn")) $("zoomBtn").textContent = zoomed ? "전체 사진" : "판독 부분만";
    }
    img.onload = () => {
      const pb = $("photoBox"); if (!pb) return;
      pb.innerHTML = `<div class="inner"></div>`;
      const inner = pb.firstChild;
      inner.appendChild(img);
      if (crops) inner.insertAdjacentHTML("beforeend",
        flagged.map(m => boxAt(crops.mcq[m.q], "")).join("") +
        `<div class="hl cur" id="hlCur" style="display:none"></div>`);
      fitPhoto();
    };
    if ($("zoomBtn")) $("zoomBtn").onclick = () => { zoomed = !zoomed; fitPhoto(); };
    img.onerror = () => { if ($("photoBox")) $("photoBox").innerHTML = `<div class="empty">사진 없음</div>`; };
    img.src = imgUrl;
    // 오른쪽 문항에 마우스를 올리거나 누르면 왼쪽 사진에서 그 줄을 파랗게 짚고 보이게 스크롤
    function pointAt(b) {
      const h = $("hlCur"); if (!h || !b) return;
      Object.assign(h.style, { display: "", left: `${b[0] * 100}%`, top: `${b[1] * 100}%`, width: `${b[2] * 100}%`, height: `${b[3] * 100}%` });
      const pc = $("photoCard"), y = b[1] * img.clientHeight + img.parentElement.offsetTop + $("photoBox").offsetTop;
      if (pc.scrollHeight > pc.clientHeight && (y < pc.scrollTop || y > pc.scrollTop + pc.clientHeight - 60)) pc.scrollTop = Math.max(0, y - pc.clientHeight / 3);
    }
    const hoverQ = (ev) => {
      if (!crops) return;
      const qc = ev.target.closest(".qcard");
      if (qc) { pointAt(crops.mcq[qc.dataset.q]); return; }
    };
    box.querySelector(".rv > .card:last-child").addEventListener("mouseover", hoverQ);
    box.querySelector(".rv > .card:last-child").addEventListener("focusin", hoverQ);

    function drawQ() {
      const qs = showAll ? read.mcq : flagged;
      // 채움 막대를 진하게 칠하는 기준: 판독에 쓴 마킹 기준 (잉크 농도 방식이면 solid_min, 이전 방식이면 marked_min)
      const rcfg = read.read_config || {};
      const hiMin = (rcfg.method === "darkness" ? rcfg.solid_min : rcfg.marked_min) ?? 0.6;
      $("qlist").innerHTML = qs.map(m => {
        const a = cur[m.q] || [];
        const key = keyAns && keyAns[m.q];
        const lock = !rscope.has(m.q);
        return `<div class="qcard ${m.needs_review && !lock ? "flag" : ""}" data-q="${m.q}" ${lock ? `style="background:var(--soft)" title="내가 맡은 문항이 아닙니다"` : ""}>
          <span class="qn">${m.q}번${sectionOf(m.q) ? `<div class="small">${esc(sectionOf(m.q))}</div>` : ""}</span>
          ${m.needs_review ? `<span class="why">${READ_WHY[m.status] || "확인 필요"}</span>` : ""}
          ${key ? `<span class="small muted" style="margin-left:auto;text-align:right">정답 ${key.join(",")}</span>` : ""}
          <div class="chs">${Array.from({ length: C }, (_, i) => { const f = (m.fill || [])[i] ?? 0;   /* 선지마다 채움 막대(위)와 번호 버튼(아래)을 한 열로 묶어 세로로 맞춤 */
            return `<div class="chcol">
              <div class="fill"><div class="bar"><i class="${f >= hiMin ? "hi" : ""}" style="height:${Math.round(f * 100)}%"></i></div>${Math.round(f * 100)}%</div>
              <button type="button" class="bub ${a.includes(i + 1) ? "on" : ""}" data-q="${m.q}" data-c="${i + 1}" ${lock ? "disabled" : ""}>${i + 1}</button></div>`; }).join("")}
            <div class="chcol"><button type="button" class="btn nores ${decided.has(m.q) && !a.length ? "on" : ""}" data-q="${m.q}" style="padding:6px 10px" ${lock ? "disabled" : ""}>무응답</button></div></div>
        </div>`;
      }).join("") || `<div class="empty small">확인할 문항이 없습니다</div>`;
    }
    drawQ();
    $("showAll").onchange = (ev) => { showAll = ev.target.checked; drawQ(); };
    $("qlist").onclick = (ev) => {
      const nr = ev.target.closest(".nores");
      if (ev.target.closest("[disabled]")) return;
      if (nr) { cur[nr.dataset.q] = []; decided.add(Number(nr.dataset.q)); drawQ(); return; }
      const b = ev.target.closest(".bub"); if (!b) return;
      const q = b.dataset.q, c = Number(b.dataset.c), a = cur[q] || [];
      cur[q] = a.includes(c) ? a.filter(x => x !== c) : [...a, c].sort();
      decided.add(Number(q));
      drawQ();
    };
    const goNext = () => {
      const items = listItems().filter(s => s.sheet_id && s.sheet_id !== sid);
      if (items[0]) { sel = items[0].sheet_id; drawList(); openSheet(sel); }
      else { drawList(); box.innerHTML = `<div class="card"><div class="empty"><b>검수를 모두 마쳤습니다</b><a class="btn primary" href="#/results" style="margin-top:12px">결과 보기 →</a></div></div>`; }
    };
    $("skip").onclick = goNext;
    $("saveRev").onclick = async () => {
      const err = $("revErr"); err.style.display = "none";
      const undecided = flagged.filter(m => !decided.has(m.q)).map(m => m.q);
      if (undecided.length) {
        err.style.display = ""; err.textContent = `${undecided.join(", ")}번 답을 골라 주세요 (비어 있으면 ‘무응답’).`;
        if (!showAll) drawQ(); return;
      }
      // 보낼 값: 확인 대상 문항은 모두(= 사람이 확정), 나머지는 판독과 달라진 문항만
      const corrections = {};
      for (const m of read.mcq) {
        const a = cur[m.q] || [];
        const orig = m.answer || [];
        if (!rscope.has(m.q)) continue;                       // 맡지 않은 문항은 보내지 않음
        if (m.needs_review || corr[m.q] != null || a.join() !== orig.join()) corrections[m.q] = a;
      }
      const sidVal = $("sidInput").value.trim();
      if (sidVal && !/^\d+$/.test(sidVal)) { err.style.display = ""; err.textContent = "학번은 숫자만 넣을 수 있습니다."; return; }
      if (!sidVal) { err.style.display = ""; err.textContent = "학번을 넣어 주세요."; return; }
      const body = { corrections };
      if (sidVal !== (sidRead.text || "")) body.student_id = sidVal;
      try {
        await api(`/api/exams/${e.exam_id}/sheets/${sid}/review`, jsonBody("PATCH", body));
        app.reviewed.add(sid);
        const s = app.sheets.find(x => x.sheet_id === sid); if (s && body.student_id) s.student_id = body.student_id;
        toast("검수 내용을 저장했습니다");
        renderSide(); goNext();
      } catch (ex) { err.style.display = ""; err.textContent = ex.message; }
    };
  }
}

// ---------------- 5. 결과·엑셀 ----------------

async function pageResults() {
  const e = app.exam;
  setTop("5. 결과·엑셀", "",
    `<a class="btn primary" href="${API_BASE}/api/exams/${e.exam_id}/results.xlsx">엑셀 내려받기</a>`);
  let res;
  try { res = await api(`/api/exams/${e.exam_id}/results`); }
  catch (ex) {
    if (ex.status === 409) {
      setTop("5. 결과·엑셀", "");
      $("view").innerHTML = `<div class="card"><div class="empty"><b>정답표가 아직 없습니다</b><a class="btn primary" href="#/key" style="margin-top:14px">정답 입력하기</a></div></div>`;
      return;
    }
    throw ex;
  }
  if (!res.length) {
    $("view").innerHTML = `<div class="card"><div class="empty"><b>아직 채점할 답안지가 없습니다</b><a class="btn primary" href="#/upload" style="margin-top:14px">사진 올리기</a></div></div>`;
    return;
  }
  // 상태별로 나누고, 확정 점수로 평균·최고·최저 계산
  const conf = res.filter(r => r.status === "확정");
  const pend = res.filter(r => r.status === "검수 대기");
  const retake = res.filter(r => r.status === "재촬영 필요");
  const scores = conf.map(r => r.score);
  const total = res.find(r => r.total_points != null)?.total_points;
  const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;

  // 문항별 정답률 (판독한 장 기준, 검수 대기 문항은 빼고 계산)
  const N = e.num_questions, rates = [];
  for (let q = 1; q <= N; q++) {
    let c = 0, n = 0;
    for (const r of res) { const it = (r.items || [])[q - 1]; if (it && it.result !== "pending") { n++; if (it.result === "correct") c++; } }
    rates.push({ q, rate: n ? c / n : null });
  }

  const statusPill = (r) => r.status === "확정" ? `<span class="pill ok">확정</span>`
    : r.status === "검수 대기" ? `<span class="pill warn">검수 대기</span>` : `<span class="pill bad">재촬영 필요</span>`;
  const sorted = [...res].sort((a, b) => (a.student_id || "~").localeCompare(b.student_id || "~"));
  // 문항 범위(과목)별 소계 열 (범위가 있을 때만)
  const secs = (res.find(r => r.sections) || {}).sections || [];
  const secHead = secs.map(s => `<th class="num">${esc(s.name)}<div class="small">${s.from}~${s.to}번</div></th>`).join("");
  const secCells = (r) => secs.map((_, i) => { const x = r.sections && r.sections[i];
    return `<td class="num">${x ? `${fmtNum(x.score)}<span> / ${fmtNum(x.total)}</span>${x.pending ? `<div class="small">검수 ${x.pending}</div>` : ""}` : "-"}</td>`; }).join("");

  $("view").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">채점한 답안지</div><div class="v">${res.length}<small> 장</small></div></div>
      <div class="stat"><div class="k">평균 (확정 ${conf.length}명)</div><div class="v">${fmtNum(avg)}<small> / ${fmtNum(total)}</small></div></div>
      <div class="stat"><div class="k">최고 · 최저</div><div class="v">${scores.length ? `${fmtNum(Math.max(...scores))} · ${fmtNum(Math.min(...scores))}` : "-"}</div></div>
      <div class="stat ${pend.length ? "warn" : ""}"><div class="k">검수 대기</div><div class="v">${pend.length}<small> 장</small></div></div>
      <div class="stat ${retake.length ? "bad" : ""}"><div class="k">재촬영 필요</div><div class="v">${retake.length}<small> 장</small></div></div>
    </div>
    ${pend.length ? `<div class="msg info">검수 대기 ${pend.length}장 <a href="#/review">검수하러 가기 →</a></div>` : ""}
    <div class="card">
      <h2>학생별 점수</h2>
      <div class="tablewrap"><table class="t">
        <thead><tr><th>학번</th><th>사진 파일</th><th>상태</th>${secHead}<th class="num">총점</th><th class="num">맞음</th><th class="num">틀림</th><th class="num">무응답</th><th class="num">복수 표시</th><th></th></tr></thead>
        <tbody>${sorted.map(r => `<tr>
          <td class="mono">${esc(r.student_id || "-")}</td>
          <td class="small">${esc(r.source)}</td>
          <td>${statusPill(r)}${r.status === "재촬영 필요" && r.error ? `<div class="small muted">${esc(r.error)}</div>` : ""}</td>
          ${secCells(r)}
          <td class="num"><b>${r.status === "확정" ? fmtNum(r.score) : r.status === "검수 대기" ? `${fmtNum(r.confirmed_score)}~${fmtNum(r.max_possible)}` : "-"}</b>${r.total_points != null ? `<span class="muted"> / ${fmtNum(r.total_points)}</span>` : ""}</td>
          <td class="num">${r.counts?.correct ?? "-"}</td><td class="num">${r.counts?.wrong ?? "-"}</td>
          <td class="num">${r.counts?.blank ?? "-"}</td><td class="num">${r.counts?.multi ?? "-"}</td>
          <td style="text-align:right">${r.status === "재촬영 필요" ? "" : `<button type="button" class="btn" data-detail="${sorted.indexOf(r)}" style="padding:4px 12px">상세</button>`}</td>
        </tr>`).join("")}</tbody></table></div>
    </div>
    <div id="studentDetail"></div>
    <div class="card">
      <h2>문항별 정답률</h2>
      <div class="rates">${rates.map(x => `<div class="rate"><b>${x.q}번</b>
        <div class="track"><div class="${x.rate != null && x.rate < 0.4 ? "low" : ""}" style="width:${x.rate == null ? 0 : Math.round(x.rate * 100)}%"></div></div>
        <span class="num" style="text-align:right">${x.rate == null ? "-" : Math.round(x.rate * 100) + "%"}</span></div>`).join("")}</div>
    </div>`;

  // ---- 학생별 상세: 학생 한 명의 문항별 답·정오·선지별 채움 비율 (검수 화면과 같은 막대 모양) ----
  const RES = { correct: ["정답", "ok"], wrong: ["오답", "bad"], multi: ["복수 표시", "warn"], blank: ["무응답", "gray"], pending: ["검수 대기", "warn"] };
  const ansTxt = (a) => a == null ? "판정 보류" : a.length ? a.join(", ") : "무응답";
  let detailSel = null, detailFilter = "all";          // 지금 열린 학생(sorted 의 위치), 보기 필터: all / bad(맞은 문항 숨김)
  function drawDetail() {
    const box = $("studentDetail");
    if (detailSel == null) { box.innerHTML = ""; return; }
    const r = sorted[detailSel];
    const its = (r.items || []).filter(it => detailFilter === "all" || it.result !== "correct");
    const cnt = r.counts || {};
    box.innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:6px">
        <h2 style="margin:0">${esc(r.student_id || r.student_id_raw || "학번 미확인")} <span class="muted small" style="font-weight:400">${esc(r.source)}</span></h2>
        ${statusPill(r)}
        <b>${r.status === "확정" ? fmtNum(r.score) : `${fmtNum(r.confirmed_score)}~${fmtNum(r.max_possible)}`}</b><span class="muted"> / ${fmtNum(r.total_points)}</span>
        <button type="button" class="btn" id="detailClose" style="margin-left:auto;padding:4px 12px">닫기</button>
      </div>
      <p class="desc">정답 ${cnt.correct ?? 0} · 오답 ${cnt.wrong ?? 0} · 무응답 ${cnt.blank ?? 0} · 복수 표시 ${cnt.multi ?? 0} · 검수 대기 ${cnt.pending ?? 0}.
        막대 = 칸을 칠한 정도(%), 검은 원 = 학생이 고른 선지, 초록 테두리 = 정답 선지입니다.</p>
      <label class="small" style="display:inline-flex;gap:6px;align-items:center;margin-bottom:10px"><input type="checkbox" id="detailWrongOnly" ${detailFilter === "bad" ? "checked" : ""}> 맞은 문항 숨기기 (틀린·무응답·확인 필요 문항만 보기)</label>
      ${its.length ? its.map(it => {
        const [label, cls] = RES[it.result] || [it.result, "gray"];
        const a = it.answer || [], key = it.key || [];
        return `<div class="qcard ${it.result === "pending" ? "flag" : ""} ${it.result === "wrong" ? "res-wrong" : ""}">
          <span class="qn">${it.q}번</span>
          <span class="pill ${cls}">${label}</span>
          <div class="fills">${(it.fill || []).map((f, i) => `<div class="fill ${a.includes(i + 1) ? "picked" : ""} ${key.includes(i + 1) ? "key" : ""}">
            <div class="bar"><i class="${a.includes(i + 1) ? "hi" : ""}" style="height:${Math.round(f * 100)}%"></i></div>${Math.round(f * 100)}%<div class="cn">${i + 1}</div></div>`).join("")}</div>
          <div class="ansbox">학생 답 <b>${esc(ansTxt(it.answer))}</b>${it.source === "review" ? ` <span class="pill gray" style="padding:0 7px;font-size:11px">검수 수정</span>` : ""}<br>
            정답 <b>${esc(key.join(", "))}</b> · <span class="muted">${fmtNum(it.earned)}/${fmtNum(it.points)}점</span></div>
        </div>`;
      }).join("") : `<div class="empty small">표시할 문항이 없습니다 🎉</div>`}
    </div>`;
    $("detailClose").onclick = () => { detailSel = null; drawDetail(); };
    $("detailWrongOnly").onchange = (ev) => { detailFilter = ev.target.checked ? "bad" : "all"; drawDetail(); };
  }
  $("view").querySelectorAll("[data-detail]").forEach(b => b.onclick = () => {
    detailSel = Number(b.dataset.detail); drawDetail();
    $("studentDetail").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

// ---------------- 로그인 · 권한 ----------------
// 권한 단계 (백엔드 app/access.py 와 같은 순서). 숫자가 클수록 더 많이 할 수 있음
const LV = { none: 0, view: 1, review: 2, owner: 3, admin: 4 };
const LV_LABEL = { view: "참가자 · 보기만", review: "참가자 · 검수 가능", owner: "시험 관리자", manager: "시험 관리자", admin: "관리자" };
// 지금 시험에서 need 단계 이상인지 (예: can("owner") → 정답표 수정·삭제 가능)
function can(need, exam = app.exam) { return LV[(exam && exam.my_level) || "none"] >= LV[need]; }
// 내가 정답 입력(key)·검수(review)할 수 있는 문항 번호 (서버 access.my_scope)
function myScope() { return (app.exam && app.exam.my_scope) || { key: [], review: [], sections: [], all: false }; }
// 문항 번호 → 과목(문항 범위) 이름
function sectionOf(q) { const s = ((app.exam && app.exam.sections) || []).find(x => x.from <= q && q <= x.to); return s ? s.name : ""; }
const isAdmin = () => app.user && app.user.role === "admin";
const canCreate = () => app.user && app.user.role === "user";   // 사용자는 누구나 시험을 만들 수 있음 (만들면 그 시험의 시험 관리자)

// 로그인 화면 그리기. 계정이 하나도 없으면 '첫 관리자 계정 만들기' 화면
async function showLogin(msg = "") {
  app.user = null; app.exam = null; app.key = null; app.sheets = null;
  const st = await api("/api/auth/status").catch(() => ({ needs_setup: false }));
  document.querySelector(".app").hidden = true;
  const box = $("login"); box.hidden = false;
  const setup = st.needs_setup;
  let asAdmin = false;
  box.innerHTML = `
      <form id="loginForm" novalidate>
        ${setup ? `<h1>첫 관리자 계정 만들기</h1>`
        : `<h1>통합 로그인</h1>
          <div class="seg" id="roleTab"><button type="button" aria-pressed="true">사용자</button><button type="button" aria-pressed="false">관리자</button></div>`}
        <div class="field"><label for="lg_id">아이디</label><input type="text" id="lg_id" autocomplete="username" autocapitalize="off" placeholder="${setup ? "예) admin" : "teacher01"}"></div>
        ${setup ? `<div class="field"><label for="lg_name">이름</label><input type="text" id="lg_name" maxlength="30" placeholder="예) 김재형"></div>` : ""}
        <div class="field"><label for="lg_pw">비밀번호 ${setup ? `<span class="hint">8자 이상</span>` : ""}</label><input type="password" id="lg_pw" autocomplete="${setup ? "new-password" : "current-password"}"></div>
        ${setup ? `<div class="field"><label for="lg_pw2">비밀번호 확인</label><input type="password" id="lg_pw2" autocomplete="new-password"></div>`
        : `<div class="opts"><label><input type="checkbox" id="lg_keep"> 로그인 상태 유지</label><a id="lg_find">비밀번호 찾기</a></div>`}
        <div class="msg err" id="lg_err" style="${msg ? "" : "display:none"}">${esc(msg)}</div>
        <button class="btn primary big block" type="submit">${setup ? "관리자 계정 만들고 시작하기" : "로그인"}</button>
        ${setup ? "" : `<div class="note">계정이 없으면 관리자에게 권한을 요청하세요</div>`}
      </form>`;
  const err = (t) => { $("lg_err").style.display = ""; $("lg_err").textContent = t; };
  if (!setup) {
    const tabs = $("roleTab").children;
    [...tabs].forEach((b, i) => b.onclick = () => { asAdmin = i === 1; tabs[0].setAttribute("aria-pressed", String(!asAdmin)); tabs[1].setAttribute("aria-pressed", String(asAdmin)); });
    $("lg_find").onclick = () => err("비밀번호를 잊었으면 관리자에게 ‘비밀번호 초기화’를 요청하세요. 관리자가 임시 비밀번호를 알려 줍니다.");
  }
  $("lg_id").focus();
  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const username = $("lg_id").value.trim().toLowerCase(), password = $("lg_pw").value;
    if (!username || !password) return err("아이디와 비밀번호를 넣어 주세요.");
    try {
      if (setup) {
        if (password !== $("lg_pw2").value) return err("비밀번호 확인이 다릅니다.");
        app.user = await api("/api/auth/setup", jsonBody("POST", { username, name: $("lg_name").value.trim(), password }));
      } else {
        app.user = await api("/api/auth/login", jsonBody("POST", { username, password, remember: $("lg_keep").checked, as_admin: asAdmin }));
      }
    } catch (ex) { return err(ex.message); }
    await enterApp(asAdmin || setup ? "#/admin/exams" : "#/exams");
  };
}

// 로그인 뒤 본 화면으로 들어가기. 임시 비밀번호로 들어왔으면 비밀번호 바꾸기 화면부터
async function enterApp(hash) {
  $("login").hidden = true; $("login").innerHTML = "";
  document.querySelector(".app").hidden = false;
  let last = null; try { last = localStorage.getItem(LS_CURRENT); } catch (_) {}
  if (last && !isAdmin()) await selectExam(last).catch(() => {});
  const want = app.user.must_change ? "#/account" : (hash || location.hash || "#/exams");
  if (location.hash === want) route(); else location.hash = want;
}

async function logout() {
  await api("/api/auth/logout", { method: "POST" }).catch(() => {});
  try { localStorage.removeItem(LS_CURRENT); } catch (_) {}
  history.replaceState(null, "", location.pathname);
  showLogin();
}

// ---------------- 내 계정 (비밀번호 바꾸기) ----------------

async function pageAccount() {
  const u = app.user;
  setTop("내 계정", `${esc(u.name)} · ${esc(u.username)} · ${esc(u.role_label)}`);
  $("view").innerHTML = `
    ${u.must_change ? `<div class="msg info">새 비밀번호로 바꿔 주세요.</div>` : ""}
    <form class="card" id="pwForm" style="max-width:480px">
      <h2>비밀번호 바꾸기</h2>
      <div class="field"><label for="pw0">지금 비밀번호</label><input type="password" id="pw0" autocomplete="current-password"></div>
      <div class="field"><label for="pw1">새 비밀번호 <span class="hint">8자 이상</span></label><input type="password" id="pw1" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">새 비밀번호 확인</label><input type="password" id="pw2" autocomplete="new-password"></div>
      <div class="msg err" id="pwErr" style="display:none"></div>
      <button class="btn primary" type="submit">비밀번호 바꾸기</button>
    </form>`;
  $("pwForm").onsubmit = async (e) => {
    e.preventDefault();
    const bad = (t) => { $("pwErr").style.display = ""; $("pwErr").textContent = t; };
    if ($("pw1").value !== $("pw2").value) return bad("새 비밀번호 확인이 다릅니다.");
    try { await api("/api/auth/password", jsonBody("POST", { old_password: $("pw0").value, new_password: $("pw1").value })); }
    catch (ex) { return bad(ex.message); }
    app.user = await api("/api/auth/me");
    toast("비밀번호를 바꿨습니다");
    location.hash = isAdmin() ? "#/admin/exams" : "#/exams";
  };
}

// ---------------- 참여자 권한 패널 (시험 현황 · 관리자 '지난 시험 관리' 공용) ----------------
// el 안에 이 시험의 소유자·참여자를 그림. 소유자·관리자면 고칠 수 있고, 아니면 목록만 보여 줌
async function renderAccessPanel(el, examId, examName, onSaved) {
  el.innerHTML = `<div class="empty">불러오는 중…</div>`;
  const [acc, dir] = await Promise.all([api(`/api/exams/${examId}/access`), api("/api/users/directory").catch(() => [])]);
  const edit = LV[acc.my_level] >= LV.owner, admin = acc.my_level === "admin";
  const N = acc.num_questions || 0;
  const st = { owner: acc.owner || "", members: acc.members.map(m => ({ ...m })),
               sections: (acc.sections || []).map(s => ({ name: s.name, from: s.from, to: s.to, assignees: [...s.assignees] })) };
  const nameOf = (u) => (dir.find(d => d.username === u) || {}).name || u;
  const ownerCands = dir.filter(d => d.role === "user");   // 만든 사람(대표 시험 관리자)으로 정할 수 있는 사용자
  const people = () => [st.owner, ...st.members.map(m => m.username)].filter(Boolean);
  function draw() {
    const used = new Set([st.owner, ...st.members.map(m => m.username)]);
    const addable = dir.filter(d => d.role === "user" && !used.has(d.username));   // 관리자 계정은 참여자로 넣지 않음
    const secRows = st.sections.map((s, i) => edit ? `
      <div class="secrow" data-s="${i}">
        <div class="row">
          <input type="text" data-f="name" value="${esc(s.name)}" placeholder="과목 (예: 물리)" style="flex:1;min-width:90px" maxlength="20">
          <input type="number" data-f="from" value="${s.from}" min="1" max="${N}" style="width:70px" aria-label="시작 문항">
          <span>~</span>
          <input type="number" data-f="to" value="${s.to}" min="1" max="${N}" style="width:70px" aria-label="끝 문항">
          <span>번</span>
          <button type="button" class="btn del" data-delsec="${i}">빼기</button>
        </div>
        <div class="row small" style="margin-top:8px">담당: ${people().map(u => `<label class="chk"><input type="checkbox" data-who="${esc(u)}" ${s.assignees.includes(u) ? "checked" : ""}> ${esc(nameOf(u))}</label>`).join("")}</div>
      </div>` : `
      <div class="who"><div><div class="nm">${esc(s.name)} · ${s.from}~${s.to}번</div></div>
        <span>${s.assignees.length ? s.assignees.map(u => esc(nameOf(u))).join(", ") : "담당 없음"}</span></div>`).join("");
    el.innerHTML = `
      <h2>참여자 권한</h2>
      <div class="acc">
        <div class="who"><div><div class="nm">${st.owner ? esc(nameOf(st.owner)) : "담당 없음"}</div>${st.owner ? `<div class="id">${esc(st.owner)}</div>` : ""}</div>
          ${admin ? `<select id="accOwner" aria-label="담당 시험 관리자"><option value="">(담당 없음)</option>${ownerCands.map(d =>
            `<option value="${esc(d.username)}" ${d.username === st.owner ? "selected" : ""}>${esc(d.name)} (${esc(d.username)})</option>`).join("")}</select>`
            : `<span class="pill blue">시험 관리자</span>`}</div>
        ${st.members.map((m, i) => `
          <div class="who"><div><div class="nm">${esc(nameOf(m.username))}</div><div class="id">${esc(m.username)}</div></div>
            ${edit ? `<select data-i="${i}" aria-label="${esc(m.username)} 권한">
              <option value="manager" ${m.level === "manager" ? "selected" : ""}>시험 관리자</option>
              <option value="review" ${m.level === "review" ? "selected" : ""}>참가자 · 검수 가능</option>
              <option value="view" ${m.level === "view" ? "selected" : ""}>참가자 · 보기만</option>
              <option value="">빼기</option></select>` : `<span class="pill gray">${LV_LABEL[m.level]}</span>`}</div>`).join("")}
      </div>
      ${edit ? `
        ${addable.length ? `<div class="row" style="margin-top:16px">
          <select id="accAdd" style="flex:1">${addable.map(d => `<option value="${esc(d.username)}">${esc(d.name)} (${esc(d.username)})</option>`).join("")}</select>
          <button class="btn" id="accAddBtn">+ 참여자 추가</button>
        </div>` : ""}
` : ""}
      <h2 style="margin-top:22px">문항 범위 담당</h2>
      <div class="acc">${secRows || `<p class="small" style="margin:0">문항 범위가 없습니다.</p>`}</div>
      ${edit ? `<button class="btn" id="secAdd" style="margin-top:12px">+ 문항 범위 추가</button>
        <button class="btn primary block big" id="accSave" style="margin-top:18px">저장</button>
        <div class="msg err" id="accErr" style="display:none;margin:12px 0 0"></div>`
        : ""}`;
    if (!edit) return;
    if (admin) $("accOwner").onchange = (e) => { st.owner = e.target.value; st.members = st.members.filter(m => m.username !== st.owner); draw(); };
    for (const s of el.querySelectorAll("select[data-i]"))
      s.onchange = () => {
        const i = +s.dataset.i;
        if (s.value) st.members[i].level = s.value;
        else { const gone = st.members[i].username; st.members.splice(i, 1); st.sections.forEach(x => x.assignees = x.assignees.filter(u => u !== gone)); }
        draw();
      };
    if ($("accAddBtn")) $("accAddBtn").onclick = () => { st.members.push({ username: $("accAdd").value, level: "review" }); draw(); };
    for (const row of el.querySelectorAll(".secrow")) {
      const sec = st.sections[+row.dataset.s];
      for (const inp of row.querySelectorAll("[data-f]"))
        inp.oninput = () => { sec[inp.dataset.f] = inp.dataset.f === "name" ? inp.value : Number(inp.value); };
      for (const cb of row.querySelectorAll("[data-who]"))
        cb.onchange = () => { sec.assignees = cb.checked ? [...sec.assignees, cb.dataset.who] : sec.assignees.filter(u => u !== cb.dataset.who); };
    }
    for (const b of el.querySelectorAll("[data-delsec]")) b.onclick = () => { st.sections.splice(+b.dataset.delsec, 1); draw(); };
    $("secAdd").onclick = () => {
      const last = st.sections.reduce((m, s) => Math.max(m, s.to), 0);
      const from = Math.min(last + 1, N), to = N;
      st.sections.push({ name: "", from, to, assignees: [] }); draw();
    };
    $("accSave").onclick = async () => {
      const body = { members: Object.fromEntries(st.members.map(m => [m.username, m.level])), sections: st.sections };
      if (admin) body.owner = st.owner;
      try { await api(`/api/exams/${examId}/access`, jsonBody("PUT", body)); }
      catch (ex) { $("accErr").style.display = ""; $("accErr").textContent = ex.message; return; }
      toast("참여자 권한을 저장했습니다");
      if (app.exam && app.exam.exam_id === examId) await selectExam(examId).catch(() => {});   // 내 문항 범위 다시 받기
      if (onSaved) onSaved();
    };
  }
  draw();
}

// ---------------- 관리자: 지난 시험 관리 ----------------

const EXAM_STATUS_PILL = { "준비": "gray", "검수 중": "warn", "완료": "ok" };

async function pageAdminExams() {
  setTop("지난 시험 관리", "",
    `<a class="btn" href="${API_BASE}/api/admin/exams.xlsx">엑셀로 내보내기</a>`);
  const rows = await api("/api/admin/exams");
  const owners = [...new Map(rows.filter(r => r.owner).map(r => [r.owner, r.owner_name])).entries()];
  app.adminSel = rows.find(r => r.exam_id === app.adminSel)?.exam_id || rows[0]?.exam_id || null;
  const f = app.adminFilter || (app.adminFilter = { q: "", owner: "" });
  $("view").innerHTML = rows.length ? `
    <div class="admin2">
      <div class="card" style="padding:0;overflow:hidden">
        <div class="toolbar" style="padding:16px 16px 0">
          <input type="text" id="fq" placeholder="시험명·과목·시험 ID 검색" value="${esc(f.q)}">
          <select id="fo"><option value="">만든 사람 전체</option><option value="-" ${f.owner === "-" ? "selected" : ""}>만든 사람 없음</option>
            ${owners.map(([u, n]) => `<option value="${esc(u)}" ${f.owner === u ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <span class="muted small" id="fcount" style="align-self:center"></span>
        </div>
        <div class="tablewrap"><table class="t">
          <thead><tr><th>시험</th><th>만든 사람</th><th>날짜</th><th class="num">답안지</th><th>상태</th><th></th></tr></thead>
          <tbody id="arows"></tbody></table></div>
      </div>
      <div class="card" id="accPanel"></div>
    </div>`
    : `<div class="card"><div class="empty"><b>아직 시험이 없습니다</b></div></div>`;
  if (!rows.length) return;

  const match = (r) => {
    const q = f.q.trim().toLowerCase();
    if (q && ![r.exam_name, r.subject, r.exam_id].some(x => (x || "").toLowerCase().includes(q))) return false;
    if (f.owner === "-") return !r.owner;
    return !f.owner || r.owner === f.owner;
  };
  function drawRows() {
    const shown = rows.filter(match);
    $("fcount").textContent = `${shown.length}개 / 전체 ${rows.length}개`;
    $("arows").innerHTML = shown.map(r => `
      <tr class="click ${r.exam_id === app.adminSel ? "sel" : ""}" data-id="${esc(r.exam_id)}">
        <td><b>${esc(r.exam_name) || "(시험명 없음)"}</b><div class="muted small">${[esc(r.subject), `객관식 ${r.num_questions}`].filter(Boolean).join(" · ")}</div></td>
        <td>${r.owner ? esc(r.owner_name) : `<span class="muted">없음</span>`}${r.members.length ? `<div class="muted small">+ 참여자 ${r.members.length}명</div>` : ""}</td>
        <td>${(r.created_at || "").slice(5, 10).replace("-", "/")}</td>
        <td class="num">${r.n_sheets}장</td>
        <td><span class="pill ${EXAM_STATUS_PILL[r.status]}">${r.status}</span>
          ${r.n_pending || r.n_retake ? `<div class="muted small">${[r.n_pending ? `검수 ${r.n_pending}` : "", r.n_retake ? `재촬영 ${r.n_retake}` : ""].filter(Boolean).join(" · ")}</div>` : ""}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn del" data-del="${esc(r.exam_id)}" data-name="${esc(r.exam_name)}">삭제</button></td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">조건에 맞는 시험이 없습니다</td></tr>`;
    for (const tr of document.querySelectorAll("#arows tr[data-id]"))
      tr.onclick = async (ev) => {
        const del = ev.target.closest("[data-del]"), open = ev.target.closest("[data-open]");
        if (del) return deleteExam(del.dataset.del, del.dataset.name);
        if (open) { await selectExam(open.dataset.open); location.hash = "#/overview"; return; }
        app.adminSel = tr.dataset.id; drawRows(); drawPanel();
      };
  }
  const drawPanel = () => {
    const r = rows.find(x => x.exam_id === app.adminSel);
    if (r) renderAccessPanel($("accPanel"), r.exam_id, r.exam_name, () => route()).catch(e => $("accPanel").innerHTML = `<div class="msg err">${esc(e.message)}</div>`);
  };
  $("fq").oninput = (e) => { f.q = e.target.value; drawRows(); };
  $("fo").onchange = (e) => { f.owner = e.target.value; drawRows(); };
  drawRows(); drawPanel();
}

// ---------------- 관리자: 계정 관리 ----------------

async function pageAdminUsers() {
  setTop("계정 관리");
  const users = await api("/api/admin/users");
  const shown = app.lastSecret; app.lastSecret = null;   // 방금 만든 임시 비밀번호 (한 번만 보여 줌)
  $("view").innerHTML = `
    ${shown ? `<div class="msg ok"><b>${esc(shown.username)}</b> 계정의 임시 비밀번호: <span class="secret">${esc(shown.pw)}</span>
      <div class="small" style="margin-top:6px">이 화면을 벗어나면 다시 볼 수 없습니다.</div></div>` : ""}
    <form class="card" id="newUser">
      <h2>계정 만들기</h2>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="margin:0;flex:1;min-width:150px"><label for="nu_id">아이디 <span class="hint">영문 소문자·숫자 3~30자</span></label><input type="text" id="nu_id" autocapitalize="off" placeholder="teacher01"></div>
        <div class="field" style="margin:0;flex:1;min-width:120px"><label for="nu_name">이름</label><input type="text" id="nu_name" maxlength="30" placeholder="교사 A"></div>
        <div class="field" style="margin:0"><label for="nu_role">역할</label><select id="nu_role"><option value="user">사용자</option><option value="admin">관리자</option></select></div>
        <div class="field" style="margin:0;flex:1;min-width:150px"><label for="nu_pw">비밀번호</label><input type="password" id="nu_pw" autocomplete="new-password" placeholder="비우면 임시 비밀번호"></div>
        <button class="btn primary" type="submit">계정 만들기</button>
      </div>
      <div class="msg err" id="nuErr" style="display:none;margin:12px 0 0"></div>
    </form>
    <div class="card" style="padding:0;overflow:hidden"><div class="tablewrap"><table class="t">
      <thead><tr><th>이름</th><th>아이디</th><th>역할</th><th>상태</th><th class="num">담당 시험</th><th>마지막 로그인</th><th></th></tr></thead>
      <tbody>${users.map(u => `<tr data-u="${esc(u.username)}">
        <td><b>${esc(u.name)}</b>${u.username === app.user.username ? ` <span class="pill blue">나</span>` : ""}</td>
        <td class="mono">${esc(u.username)}</td>
        <td><select data-role aria-label="역할">${[["user", "사용자"], ["admin", "관리자"]].map(([v, l]) => `<option value="${v}" ${u.role === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
        <td>${u.active ? (u.must_change ? `<span class="pill warn">비밀번호 변경 전</span>` : `<span class="pill ok">사용 중</span>`) : `<span class="pill gray">사용 중지</span>`}</td>
        <td class="num">${u.n_owned}</td>
        <td class="small">${fmtDate(u.last_login)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn" data-act="rename">이름</button>
          <button class="btn" data-act="reset">비밀번호 초기화</button>
          <button class="btn ${u.active ? "del" : ""}" data-act="toggle">${u.active ? "사용 중지" : "다시 사용"}</button></td>
      </tr>`).join("")}</tbody></table></div></div>`;

  $("newUser").onsubmit = async (e) => {
    e.preventDefault();
    const body = { username: $("nu_id").value.trim().toLowerCase(), name: $("nu_name").value.trim(), role: $("nu_role").value, password: $("nu_pw").value || null };
    try {
      const u = await api("/api/admin/users", jsonBody("POST", body));
      if (u.temp_password) app.lastSecret = { username: u.username, pw: u.temp_password };
      toast("계정을 만들었습니다"); route();
    } catch (ex) { $("nuErr").style.display = ""; $("nuErr").textContent = ex.message; }
  };
  const patch = async (u, body) => {
    try { await api(`/api/admin/users/${encodeURIComponent(u)}`, jsonBody("PATCH", body)); toast("저장했습니다"); }
    catch (ex) { alert(ex.message); }
    if (u === app.user.username) app.user = await api("/api/auth/me").catch(() => app.user);
    route();
  };
  for (const tr of document.querySelectorAll("tr[data-u]")) {
    const u = tr.dataset.u, info = users.find(x => x.username === u);
    tr.querySelector("[data-role]").onchange = (e) => patch(u, { role: e.target.value });
    tr.querySelector("[data-act=rename]").onclick = () => { const n = prompt(`${u} 계정의 이름`, info.name); if (n != null && n.trim()) patch(u, { name: n.trim() }); };
    tr.querySelector("[data-act=toggle]").onclick = () => {
      if (info.active && !confirm(`${info.name}(${u}) 계정을 사용 중지할까요?\n바로 로그아웃되고 다시 사용으로 바꿀 때까지 로그인할 수 없습니다. 시험 기록은 그대로 남습니다.`)) return;
      patch(u, { active: !info.active });
    };
    tr.querySelector("[data-act=reset]").onclick = async () => {
      if (!confirm(`${info.name}(${u}) 계정의 비밀번호를 임시 비밀번호로 바꿀까요?\n지금 로그인한 곳은 모두 로그아웃됩니다.`)) return;
      try { const r = await api(`/api/admin/users/${encodeURIComponent(u)}/reset-password`, { method: "POST" }); app.lastSecret = { username: u, pw: r.temp_password }; }
      catch (ex) { alert(ex.message); }
      route();
    };
  }
}

// ---------------- 관리자: 시스템 설정 ----------------

async function pageAdminSettings() {
  setTop("시스템 설정");
  const s = await api("/api/admin/settings");
  const val = { ...s.read };
  const input = (k, sp) => sp.choices
    ? `<select data-k="${k}">${Object.entries(sp.choices).map(([v, l]) => `<option value="${v}" ${val[k] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
    : `<input type="number" data-k="${k}" min="${sp.min}" max="${sp.max}" step="0.01" value="${val[k]}">`;
  const defText = (k, sp) => sp.choices ? sp.choices[s.defaults[k]] : s.defaults[k];
  $("view").innerHTML = `
    <div class="card">
      <h2>판독 기준값</h2>
      ${s.updated_at ? `<p class="desc">마지막 변경: ${fmtDate(s.updated_at)} (${esc(s.updated_by || "")})</p>` : ""}
      ${Object.entries(s.specs).map(([k, sp]) => `
        <div class="setrow ${val[k] !== s.defaults[k] ? "changed" : ""}" data-row="${k}">
          <div><b>${esc(sp.label)}</b><div class="def">기본값 ${esc(defText(k, sp))}${sp.choices ? "" : ` · 범위 ${sp.min}~${sp.max}`}</div></div>
          <div>${input(k, sp)}</div>
        </div>`).join("")}
      <div class="msg err" id="setErr" style="display:none;margin:16px 0 0"></div>
      <div class="row" style="margin-top:18px">
        <button class="btn primary" id="setSave">저장</button>
        <button class="btn" id="setReset">모두 기본값으로</button>
      </div>
    </div>`;
  const collect = () => Object.fromEntries([...document.querySelectorAll("[data-k]")].map(el =>
    [el.dataset.k, el.tagName === "SELECT" ? el.value : Number(el.value)]));
  const save = async (body) => {
    try { await api("/api/admin/settings", jsonBody("PUT", body)); toast("설정을 저장했습니다"); route(); }
    catch (ex) { $("setErr").style.display = ""; $("setErr").textContent = ex.message; }
  };
  $("setSave").onclick = () => save(collect());
  $("setReset").onclick = () => { if (confirm("판독 기준값을 모두 기본값으로 되돌릴까요?")) save({ ...s.defaults }); };
}

// ---------------- 시작 ----------------
// 마지막으로 고른 시험이 있으면 다시 불러오고, 주소에 맞는 페이지를 그림
// 로그인부터 확인: 되어 있으면 본 화면, 아니면 로그인 화면
(async () => {
  try { app.user = await api("/api/auth/me"); }
  catch (_) { return showLogin(); }
  await enterApp(location.hash);
})();
